# smart-orchestrator job: reindex local agent sessions, then rsync the index with the remote host.
# Deployed by install.sh to ~/opt/agent-session-manager/smart-orchestrator.conf and symlinked as
# ~/opt/smart-orchestrator/jobs/asm-reindex-and-rsync.conf (github.com/JeanLescutMuller/smart-orchestrator).
[job]
command = ~/opt/agent-session-manager/asm-reindex-and-rsync.sh
success_within = 30m
fail_within = 30m
timeout = 15m
preconditions =
    online
summary = ^\s*(Step 3b|Done):
