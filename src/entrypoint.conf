# Dashboard settings of the job agent-session-manager (job-runner DESIGN §11), deployed beside entrypoint.sh by install.sh,
# which gives them to the dashboard (put-conf.sh: on the VM a symlink, elsewhere a copy sent to the VM).
# KEY=value; KEY@<machine>=value for one machine; every key and its default: ~/dev/job-runner/dashboard/conf/_default.conf.
RED_AFTER_MIN=90                 # red: no success on any machine for 90 min (it runs every 30 min)
SILENT_AFTER_MIN@H-Frank-1=90    # grey: the VM silent for 90 min
